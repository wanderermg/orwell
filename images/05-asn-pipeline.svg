<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-label="От списка автономных систем до VPN-маршрута"><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245EEA"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F73"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B96B0A"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52617A"/></marker></defs><rect width="1200" height="655" rx="24" fill="#F5F7FC"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="53" font-size="30" fill="#172033" text-anchor="start" font-weight="700">От списка автономных систем до VPN-маршрута</text><text x="40" y="88" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Префиксы определяют назначения; метка пакета выбирает таблицу маршрутизации.</text><rect x="35" y="140" width="235" height="135" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="57" y="178" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">Список ASN</text><text x="57" y="215" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Операторы</text><text x="57" y="244" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">и сервисы</text><rect x="330" y="140" width="220" height="135" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="352" y="178" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">RIPEstat</text><text x="352" y="215" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Получение сетей</text><text x="352" y="244" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">по каждому ASN</text><rect x="610" y="140" width="235" height="135" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="632" y="178" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">IPv4-префиксы</text><text x="632" y="215" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Проверка ответов</text><text x="632" y="244" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">и итогового набора</text><rect x="905" y="140" width="260" height="135" rx="18" fill="white" stroke="#7552BE" stroke-width="2"/><text x="927" y="178" font-size="24" fill="#7552BE" text-anchor="start" font-weight="700">nftables set</text><text x="927" y="215" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Набор адресных сетей</text><text x="927" y="244" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Атомарное обновление</text><path d="M 270 207 H 325" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#blue)"/><path d="M 550 207 H 605" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#blue)"/><path d="M 845 207 H 900" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#blue)"/><rect x="35" y="410" width="315" height="145" rx="18" fill="white" stroke="#087F73" stroke-width="2"/><text x="57" y="448" font-size="24" fill="#087F73" text-anchor="start" font-weight="700">Метка пакета</text><text x="57" y="485" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Назначение входит в set</text><text x="57" y="514" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">и VPN доступен → 0x100</text><rect x="435" y="410" width="315" height="145" rx="18" fill="white" stroke="#087F73" stroke-width="2"/><text x="457" y="448" font-size="24" fill="#087F73" text-anchor="start" font-weight="700">Policy routing</text><text x="457" y="485" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Метка выбирает</text><text x="457" y="514" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">таблицу маршрутов 100</text><rect x="835" y="410" width="330" height="145" rx="18" fill="white" stroke="#087F73" stroke-width="2"/><text x="857" y="448" font-size="24" fill="#087F73" text-anchor="start" font-weight="700">WireGuard</text><text x="857" y="485" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Маршрут через wg0</text><text x="857" y="514" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">к VPN-серверу</text><path d="M 1035 275 V 330 H 192 V 405" fill="none" stroke="#087F73" stroke-width="3" marker-end="url(#teal)"/><text x="600" y="365" font-size="20" fill="#52617A" text-anchor="middle" font-weight="400">Набор сетей используется при обработке пакетов из LAN</text><path d="M 350 482 H 430" fill="none" stroke="#087F73" stroke-width="3" marker-end="url(#teal)"/><path d="M 750 482 H 830" fill="none" stroke="#087F73" stroke-width="3" marker-end="url(#teal)"/><text x="40" y="610" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Сверху — обновление списка сетей. Снизу — выбор пути для подходящего пакета.</text></g></svg>