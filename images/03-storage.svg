<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775" role="img" aria-label="Программы на SD и временные записи в RAM"><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245EEA"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F73"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B96B0A"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52617A"/></marker></defs><rect width="1200" height="775" rx="24" fill="#F5F7FC"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="53" font-size="30" fill="#172033" text-anchor="start" font-weight="700">Программы на SD и временные записи в RAM</text><text x="40" y="88" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Постоянные данные общие для двух версий ОС; загрузочная область здесь не в масштабе.</text><rect x="35" y="125" width="620" height="475" rx="20" fill="#EAF0FC"/><rect x="700" y="125" width="465" height="475" rx="20" fill="#E5F4EF"/><text x="60" y="165" font-size="25" fill="#172033" text-anchor="start" font-weight="700">SD-карта</text><text x="725" y="165" font-size="25" fill="#087F73" text-anchor="start" font-weight="700">Оперативная память</text><rect x="60" y="190" width="570" height="110" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="82" y="228" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">Слот A · 4 ГиБ</text><text x="82" y="265" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Активный rootfs · ext4 · только чтение</text><rect x="60" y="325" width="570" height="110" rx="18" fill="white" stroke="#7552BE" stroke-width="2"/><text x="82" y="363" font-size="24" fill="#7552BE" text-anchor="start" font-weight="700">Слот B · 4 ГиБ</text><text x="82" y="400" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Резервный rootfs · запись только при OTA</text><rect x="60" y="460" width="570" height="115" rx="18" fill="white" stroke="#B96B0A" stroke-width="2"/><text x="82" y="498" font-size="24" fill="#B96B0A" text-anchor="start" font-weight="700">persist · 2 ГиБ</text><text x="82" y="535" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Ключи · настройки · рабочее состояние · OTA</text><rect x="725" y="190" width="415" height="155" rx="18" fill="white" stroke="#087F73" stroke-width="2"/><text x="747" y="228" font-size="24" fill="#087F73" text-anchor="start" font-weight="700">Верхний слой OverlayFS</text><text x="747" y="265" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Временные изменения ОС</text><text x="747" y="294" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Лимит 128 МиБ</text><path d="M 630 245 H 719" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#blue)"/><text x="675" y="230" font-size="17" fill="#245EEA" text-anchor="middle" font-weight="400">ro</text><rect x="725" y="405" width="415" height="170" rx="18" fill="white" stroke="#087F73" stroke-width="2"/><text x="747" y="443" font-size="24" fill="#087F73" text-anchor="start" font-weight="700">tmpfs и журнал</text><text x="747" y="480" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">/run и /tmp</text><text x="747" y="509" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Журнал в RAM · до 16 МиБ</text><text x="747" y="538" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Swap на SD отсутствует</text><text x="40" y="650" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">В обоих слотах: rootfs + ядро + initramfs + DTB. Активным может быть A или B.</text><text x="40" y="687" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Служебная область U-Boot и его резервируемое окружение здесь не показаны.</text></g></svg>