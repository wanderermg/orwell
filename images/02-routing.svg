<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-label="Маршрутизация по сетям и состоянию VPN"><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245EEA"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F73"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B96B0A"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52617A"/></marker></defs><rect width="1200" height="810" rx="24" fill="#F5F7FC"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="53" font-size="30" fill="#172033" text-anchor="start" font-weight="700">Маршрутизация по сетям и состоянию VPN</text><text x="40" y="88" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Список назначений сохраняется даже при отказе туннеля.</text><rect x="425" y="125" width="365" height="120" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="447" y="163" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">Пакет из LAN</text><text x="447" y="200" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">IPv4-адрес назначения</text><rect x="35" y="300" width="300" height="160" rx="18" fill="white" stroke="#7552BE" stroke-width="2"/><text x="57" y="338" font-size="24" fill="#7552BE" text-anchor="start" font-weight="700">Набор сетей</text><text x="57" y="375" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">ASN → RIPEstat</text><text x="57" y="404" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Проверка ответов</text><text x="57" y="433" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Атомарная замена nft set</text><rect x="425" y="290" width="365" height="160" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="447" y="328" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">Выбор пути</text><text x="447" y="365" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Адрес есть в наборе?</text><text x="447" y="394" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">VPN-проба успешна?</text><path d="M 607 245 V 285" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#blue)"/><path d="M 335 370 H 420" fill="none" stroke="#52617A" stroke-width="3" marker-end="url(#muted)"/><rect x="160" y="545" width="345" height="160" rx="18" fill="white" stroke="#087F73" stroke-width="2"/><text x="182" y="583" font-size="24" fill="#087F73" text-anchor="start" font-weight="700">WireGuard</text><text x="182" y="620" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Метка 0x100</text><text x="182" y="649" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Policy routing · table 100</text><text x="182" y="678" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Выход через wg0</text><rect x="710" y="545" width="345" height="160" rx="18" fill="white" stroke="#B96B0A" stroke-width="2"/><text x="732" y="583" font-size="24" fill="#B96B0A" text-anchor="start" font-weight="700">Обычный WAN</text><text x="732" y="620" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Адрес вне выбранных сетей</text><text x="732" y="649" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">или туннель недоступен</text><path d="M 510 450 V 490 H 332 V 540" fill="none" stroke="#087F73" stroke-width="3" marker-end="url(#teal)"/><path d="M 705 450 V 490 H 882 V 540" fill="none" stroke="#B96B0A" stroke-width="3" marker-end="url(#amber)"/><text x="330" y="487" font-size="19" fill="#087F73" text-anchor="middle" font-weight="400">оба условия выполнены</text><text x="895" y="487" font-size="19" fill="#B96B0A" text-anchor="middle" font-weight="400">условие не выполнено</text><text x="40" y="770" font-size="21" fill="#52617A" text-anchor="start" font-weight="400">Fail-open: при отказе VPN трафик разрешён через WAN. Это не kill switch.</text></g></svg>