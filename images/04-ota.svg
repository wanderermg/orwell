<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img" aria-label="От новой версии на сервере до подтверждённой ОС"><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245EEA"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F73"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B96B0A"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52617A"/></marker></defs><rect width="1200" height="875" rx="24" fill="#F5F7FC"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="53" font-size="30" fill="#172033" text-anchor="start" font-weight="700">От новой версии на сервере до подтверждённой ОС</text><text x="40" y="88" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">RAUC устанавливает образ, U-Boot выбирает слот, служба подтверждения проверяет загрузку.</text><rect x="35" y="145" width="335" height="160" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="57" y="183" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">1 · Проверка версии</text><text x="57" y="220" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Таймер запускает агент</text><text x="57" y="249" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">HTTPS с mTLS</text><text x="57" y="278" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Чтение release.json</text><rect x="435" y="145" width="335" height="160" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="457" y="183" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">2 · Проверка пакета</text><text x="457" y="220" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Скачать .raucb</text><text x="457" y="249" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Подпись · модель · версия</text><text x="457" y="278" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Неверный пакет не ставится</text><rect x="835" y="145" width="330" height="160" rx="18" fill="white" stroke="#7552BE" stroke-width="2"/><text x="857" y="183" font-size="24" fill="#7552BE" text-anchor="start" font-weight="700">3 · Установка RAUC</text><text x="857" y="220" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Целевой слот → bad</text><text x="857" y="249" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Запись полного образа</text><text x="857" y="278" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Успех → следующий старт</text><path d="M 370 225 H 430" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#blue)"/><path d="M 770 225 H 830" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#blue)"/><rect x="835" y="395" width="330" height="150" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="857" y="433" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">4 · Пробная загрузка</text><text x="857" y="470" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Агент запрашивает reboot</text><text x="857" y="499" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">U-Boot выбирает слот</text><rect x="435" y="395" width="335" height="150" rx="18" fill="white" stroke="#245EEA" stroke-width="2"/><text x="457" y="433" font-size="24" fill="#245EEA" text-anchor="start" font-weight="700">5 · Локальная проверка</text><text x="457" y="470" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Сервисы и конфигурация</text><text x="457" y="499" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Интернет не обязателен</text><rect x="35" y="395" width="335" height="150" rx="18" fill="white" stroke="#087F73" stroke-width="2"/><text x="57" y="433" font-size="24" fill="#087F73" text-anchor="start" font-weight="700">6 · Подтверждение</text><text x="57" y="470" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">rauc status mark-good</text><text x="57" y="499" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Слот подтверждён</text><path d="M 1000 305 V 390" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#blue)"/><path d="M 835 470 H 775" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#blue)"/><path d="M 435 470 H 375" fill="none" stroke="#087F73" stroke-width="3" marker-end="url(#teal)"/><text x="405" y="450" font-size="18" fill="#087F73" text-anchor="middle" font-weight="400">OK</text><rect x="435" y="640" width="730" height="140" rx="18" fill="white" stroke="#B96B0A" stroke-width="2"/><text x="457" y="678" font-size="24" fill="#B96B0A" text-anchor="start" font-weight="700">Если загрузка не подтверждается</text><text x="457" y="715" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Повторные попытки, затем предыдущий рабочий слот.</text><text x="457" y="744" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Лимит: три неудачные загрузки нового слота.</text><path d="M 600 545 V 635" fill="none" stroke="#B96B0A" stroke-width="3" marker-end="url(#amber)"/><text x="620" y="595" font-size="20" fill="#B96B0A" text-anchor="start" font-weight="400">нет подтверждения</text><text x="40" y="835" font-size="20" fill="#52617A" text-anchor="start" font-weight="400">Обрыв копирования не активирует цель. Успешная установка и успешная загрузка — разные этапы.</text></g></svg>